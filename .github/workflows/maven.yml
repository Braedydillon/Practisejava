name: Maven Automated Testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest 

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4 

    - name: Set up JDK 25
      uses: actions/setup-java@v4 
      with:
        java-version: '25'        
        distribution: 'temurin'   # Switched to temurin to support the brand-new Java 25 binaries
        cache: maven              

    - name: Build with Maven
      run: mvn --batch-mode -DskipTests package --file Packages/pom.xml

    - name: Run Automated Tests
      run: mvn --batch-mode -Dmaven.test.failure.ignore=true test --file Packages/pom.xml
